name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  # 版本号来自 tag（vX.Y.Z → X.Y.Z），四个平台构建统一注入
  # --build-name/--build-number，应用内「关于」页与系统信息保持一致。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - id: ver
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # media_kit 的 CMake 脚本会直接从 GitHub Releases 拉取 libmpv/ANGLE，
      # Actions 机器直连经常超时并留下半截文件，导致 MD5 校验失败。
      # 这里提前用国内加速线路下载并校验，命中缓存后 CMake 不再联网。
      - name: Prefetch media_kit prebuilt libraries
        shell: pwsh
        run: |
          $dir = "build/windows/x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $items = @(
            @{
              Name = "mpv-dev-x86_64-20230924-git-652a1dd.7z"
              Md5  = "a832ef24b3a6ff97cd2560b5b9d04cd8"
              Url  = "https://github.com/media-kit/libmpv-win32-video-build/releases/download/2023-09-24"
            },
            @{
              Name = "ANGLE.7z"
              Md5  = "e866f13e8d552348058afaafe869b1ed"
              Url  = "https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1"
            }
          )
          $mirrors = @(
            "https://ghfast.top/",
            "https://gh-proxy.com/",
            "https://gh.chjina.com/",
            "https://gh.monlor.com/",
            "https://gh.meali.top/",
            "https://ghgo.de5.net/",
            "https://ghpxy.hwinzniej.top/",
            ""
          )
          foreach ($item in $items) {
            $dest = Join-Path $dir $item.Name
            if ((Test-Path $dest) -and
                ((Get-FileHash $dest -Algorithm MD5).Hash.ToLower() -eq $item.Md5)) {
              Write-Host "cached: $($item.Name)"
              continue
            }
            $ok = $false
            foreach ($mirror in $mirrors) {
              $url = "$mirror$($item.Url)/$($item.Name)"
              try {
                Write-Host "downloading: $url"
                # curl 自带断点外的重试与失败码判断；GitHub 的 release
                # 资源近期经常返回 504 或截断，IWR 遇到截断不会报错。
                curl.exe -fL --retry 3 --retry-all-errors --retry-delay 2 `
                  --connect-timeout 20 --max-time 900 -o $dest $url
                if ($LASTEXITCODE -ne 0) { throw "curl exit $LASTEXITCODE" }
                if ((Get-FileHash $dest -Algorithm MD5).Hash.ToLower() -eq $item.Md5) {
                  $ok = $true
                  break
                }
                Write-Host "md5 mismatch: $url"
              } catch {
                Write-Host "failed: $url"
              }
            }
            if (-not $ok) { throw "unable to download $($item.Name)" }
          }
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build windows --release \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version windows/installer/framelet.iss
          Move-Item windows/installer/Output/FrameletSetup-$version-x64.exe FrameletSetup-$version-x64.exe
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath framelet-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-windows
          path: |
            FrameletSetup-*-x64.exe
            framelet-windows-x64-portable.zip

  android:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore Android release keystore
        env:
          FRAMELET_KEYSTORE_BASE64: ${{ secrets.FRAMELET_KEYSTORE_BASE64 }}
          FRAMELET_KEYSTORE_PASSWORD: ${{ secrets.FRAMELET_KEYSTORE_PASSWORD }}
          FRAMELET_KEY_ALIAS: ${{ secrets.FRAMELET_KEY_ALIAS }}
          FRAMELET_KEY_PASSWORD: ${{ secrets.FRAMELET_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$FRAMELET_KEYSTORE_BASE64" ] || [ -z "$FRAMELET_KEYSTORE_PASSWORD" ] || [ -z "$FRAMELET_KEY_ALIAS" ] || [ -z "$FRAMELET_KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are incomplete; falling back to debug signing."
            exit 0
          fi
          echo "$FRAMELET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/framelet-release.jks"
          echo "FRAMELET_KEYSTORE_PATH=$RUNNER_TEMP/framelet-release.jks" >> "$GITHUB_ENV"
          # Build 是后续独立步骤，只有写进 GITHUB_ENV 的变量才会被 Gradle 读到；
          # 这些必须一起导出，否则 canSignRelease 为 false，又会退回 debug 签名。
          echo "FRAMELET_KEYSTORE_PASSWORD=$FRAMELET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FRAMELET_KEY_ALIAS=$FRAMELET_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FRAMELET_KEY_PASSWORD=$FRAMELET_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Verify APK signing
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/apk-certs.txt"; then
            if [ -n "$FRAMELET_KEYSTORE_PATH" ]; then
              # 配了 release keystore 仍出现 debug 证书，说明 Gradle 没拿到签名参数。
              echo "::error::APK is still debug-signed despite release keystore being configured"
              exit 1
            fi
            echo "::warning::APK is debug-signed; configure Android signing secrets or in-app updates will fail with signature mismatch"
          fi
      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk framelet-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-android
          path: framelet-android.apk

  macos:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build macos --release \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Package dmg
        run: |
          # 未经签名的 App Sandbox 应用在 macOS Gatekeeper 下常表现为“无法打开”；
          # ad-hoc 签名可保留沙盒权限，并允许用户通过右键打开或清除隔离属性运行。
          codesign --force --deep --entitlements macos/Runner/Release.entitlements \
            --sign - build/macos/Build/Products/Release/framelet.app
          hdiutil create -volname "Framelet" \
            -srcfolder build/macos/Build/Products/Release/framelet.app \
            -ov -format UDZO framelet-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-macos
          path: framelet-macos.dmg

  # iOS 未签名构建无实际交付价值且最耗时，且会拖住 release 作业，
  # 暂不出包；需要验证 iOS 工程时在 Actions 页手动触发本工作流即可。
  release:
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    # 任一平台因网络/依赖下载失败时，不要让整次发布彻底没有 Release；
    # 先把已成功平台的产物发出去，失败的平台后续单独重跑即可补传。
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FrameletSetup-*-x64.exe
            framelet-windows-x64-portable.zip
            framelet-android.apk
            framelet-macos.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true
