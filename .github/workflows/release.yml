name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  # 版本号来自 tag（vX.Y.Z → X.Y.Z），四个平台构建统一注入
  # --build-name/--build-number，应用内「关于」页与系统信息保持一致。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - id: ver
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build windows --release \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version windows/installer/framelet.iss
          Move-Item windows/installer/Output/FrameletSetup-$version-x64.exe FrameletSetup-$version-x64.exe
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath framelet-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-windows
          path: |
            FrameletSetup-*-x64.exe
            framelet-windows-x64-portable.zip

  android:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk framelet-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-android
          path: framelet-android.apk

  macos:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build macos --release \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Package dmg
        run: |
          hdiutil create -volname "Framelet" \
            -srcfolder build/macos/Build/Products/Release/framelet.app \
            -ov -format UDZO framelet-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-macos
          path: framelet-macos.dmg

  ios:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 未签名构建：无开发者账号无法安装，仅作工程验证产物
      - name: Build
        env:
          APP_VERSION: ${{ needs.resolve.outputs.version }}
          APP_BUILD: ${{ needs.resolve.outputs.build }}
        shell: bash
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" --build-number="$APP_BUILD"
      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry framelet-ios-unsigned.zip Payload
      - uses: actions/upload-artifact@v4
        with:
          name: framelet-ios-unsigned
          path: framelet-ios-unsigned.zip

  release:
    needs: [windows, android, macos, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FrameletSetup-*-x64.exe
            framelet-windows-x64-portable.zip
            framelet-android.apk
            framelet-macos.dmg
            framelet-ios-unsigned.zip
          generate_release_notes: true
